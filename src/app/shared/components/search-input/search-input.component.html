<mat-form-field appearance="outline" class="search-input">
  <mat-icon matPrefix>search</mat-icon>
  <input matInput [formControl]="control" [placeholder]="placeholder" />
  @if (loading) {
    <mat-icon matSuffix class="search-input__spinner">autorenew</mat-icon>
  } @else if (control.value) {
    <button mat-icon-button matSuffix type="button" aria-label="Clear search" (click)="clear()">
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
