<app-page-header [title]="isEditMode ? 'Edit Project' : 'New Project'" />

@if (loadingExisting()) {
  <app-loading-spinner message="Loading project..." />
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" class="project-form" novalidate>
    <mat-form-field appearance="outline" class="project-form__field">
      <mat-label>Project Name</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>
    <app-form-error [control]="form.controls.name" label="Project name" />

    <mat-form-field appearance="outline" class="project-form__field project-form__field--key">
      <mat-label>Project Key</mat-label>
      <input matInput formControlName="key" placeholder="DEV" required style="text-transform: uppercase" />
      <mat-hint>2-6 uppercase letters</mat-hint>
    </mat-form-field>
    <app-form-error [control]="form.controls.key" label="Project key" />

    <mat-form-field appearance="outline" class="project-form__field">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" maxlength="500"></textarea>
    </mat-form-field>
    <app-form-error [control]="form.controls.description" label="Description" />

    <div class="project-form__row">
      <div>
        <mat-form-field appearance="outline" class="project-form__field">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate" required />
          <mat-datepicker-toggle matIconSuffix [for]="startPicker" />
          <mat-datepicker #startPicker />
        </mat-form-field>
        <app-form-error [control]="form.controls.startDate" label="Start date" />
      </div>
      <div>
        <mat-form-field appearance="outline" class="project-form__field">
          <mat-label>End Date</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate" required />
          <mat-datepicker-toggle matIconSuffix [for]="endPicker" />
          <mat-datepicker #endPicker />
        </mat-form-field>
        <app-form-error [control]="form.controls.endDate" label="End date" />
      </div>
    </div>

    <mat-form-field appearance="outline" class="project-form__field">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status" required>
        @for (option of statusOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (errorMessage()) {
      <div class="project-form__error" role="alert">{{ errorMessage() }}</div>
    }

    <div class="project-form__actions">
      <button mat-button type="button" routerLink="/projects">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving...' : isEditMode ? 'Save Changes' : 'Create Project' }}
      </button>
    </div>
  </form>
}
