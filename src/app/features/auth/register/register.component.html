<h1 class="register__title">Create an account</h1>
<p class="register__subtitle">Start managing projects with DevBoard.</p>

<form [formGroup]="form" (ngSubmit)="submit()" class="register__form" novalidate>
  <div class="register__name-row">
    <div>
      <mat-form-field appearance="outline" class="register__field">
        <mat-label>First name</mat-label>
        <input matInput formControlName="firstName" autocomplete="given-name" required />
      </mat-form-field>
      <app-form-error [control]="form.controls.firstName" label="First name" />
    </div>
    <div>
      <mat-form-field appearance="outline" class="register__field">
        <mat-label>Last name</mat-label>
        <input matInput formControlName="lastName" autocomplete="family-name" required />
      </mat-form-field>
      <app-form-error [control]="form.controls.lastName" label="Last name" />
    </div>
  </div>

  <mat-form-field appearance="outline" class="register__field">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="email" required />
  </mat-form-field>
  <app-form-error [control]="form.controls.email" label="Email" />

  <mat-form-field appearance="outline" class="register__field">
    <mat-label>Password</mat-label>
    <input
      matInput
      [type]="hidePassword() ? 'password' : 'text'"
      formControlName="password"
      autocomplete="new-password"
      required
    />
    <button
      mat-icon-button
      matSuffix
      type="button"
      [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
      (click)="togglePasswordVisibility()"
    >
      <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>
  <app-form-error [control]="form.controls.password" label="Password" />

  <mat-form-field appearance="outline" class="register__field">
    <mat-label>Confirm password</mat-label>
    <input
      matInput
      [type]="hideConfirmPassword() ? 'password' : 'text'"
      formControlName="confirmPassword"
      autocomplete="new-password"
      required
    />
    <button
      mat-icon-button
      matSuffix
      type="button"
      [attr.aria-label]="hideConfirmPassword() ? 'Show password' : 'Hide password'"
      (click)="toggleConfirmPasswordVisibility()"
    >
      <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>
  <app-form-error [control]="form.controls.confirmPassword" label="Confirm password" />

  @if (errorMessage()) {
    <div class="register__error" role="alert">{{ errorMessage() }}</div>
  }

  <button
    mat-flat-button
    color="primary"
    type="submit"
    class="register__submit"
    [disabled]="loading()"
  >
    @if (loading()) {
      <mat-progress-spinner diameter="20" mode="indeterminate" />
    } @else {
      Create account
    }
  </button>
</form>

<p class="register__footer">
  Already have an account? <a routerLink="/login">Sign in</a>
</p>
